name: Deploy PR previews

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: github-pages-content
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Stage preview site
        if: github.event.action != 'closed'
        run: |
          rm -rf _preview-site
          mkdir -p _preview-site
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_preview-site/' \
            --exclude 'github-pages-deploy-action-temp-deployment-folder/' \
            ./ _preview-site/

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_preview-site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: www.pinnaclesmp.org
          wait-for-pages-deployment: false
          comment: true
          qr-code: true
